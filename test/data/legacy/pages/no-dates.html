yed a career in industrial sales until his retirement.   Cade was a member of Greenlawn Baptist Church, where he served as a deacon. He became a member of Kathwood Baptist Church prior to moving with Sandie to Atlanta, Georgia in 2022 to be near his daughter.  He was a Vietnam Veteran in the United States Navy Seabees.  Cade was a servant leader, and a devoted, proud husband and father. He studied South Carolina history and the Revolutionary War, often perusing antique shops and bookstores for rare editions. He enjoyed maps, road trips, and visiting historic landmarks. Cade was known for a laugh that could fill a room, a sense of humor, and a love of dancing The Shag.  He is survived by his wife Sandie; his daughter Amy Love (Brad Neil) of Atlanta, Georgia; his son William \"Billy\" Cade Love of Highlands, North Carolina; and many cherished in-laws, nieces and nephews. He is predeceased by his sister Laurie Elizabeth Love Cone of Greenwood, South Carolina.  A memorial service will be held on September 25, 2026 at 10 a.m. at Dunbar Funeral Home in Columbia, South Carolina, with Reverend Beth McConnell of Kathwood Baptist Church officiating. The family will receive friends at the funeral home after the service.  A private burial will follow at the Memorial Park Cemetery in Orangeburg, South Carolina, where Cade grew up and the Love family - his parents and grandparents - are buried.","articleSection":"Obituaries","author":[{"@type":"Organization","name":"Legacy"}],"copyrightHolder":{"@type":"Organization","name":"Legacy.com","url":"https://www.legacy.com"},"creator":"Legacy.com","dateCreated":"2026-09-19T00:00:00.000Z","dateModified":"2026-09-19T00:00:00.000Z","datePublished":"2026-09-19T00:00:00.000Z","description":"Baylus \"Cade\" Love, Jr., age 79, beloved husband of Sandra \"Sandie\" Jane Clamp Love, passed away September 16, 2026.  Born February 1, 1947, in Charleston, South Carolina, he was the son of the late B","genre":"Obituary(Obit), Biography","headline":"B
