<!DOCTYPE html><html><head><meta charset="utf-8"><title data-react-helmet="true">Anne Morris Obituary (1942 - 2026) - Mount Pleasant, SC - The State</title><meta data-react-helmet="true" content="Legacy.com" property="og:site_name"/><meta data-react-helmet="true" content="ARTICLE" property="og:type"/><meta data-react-helmet="true" content="https://www.legacy.com/us/obituaries/thestate/name/anne-morris-obituary?id=62316159" key="og:url" property="og:url"/><meta data-react-helmet="true" content="Anne Morris Obituary (1942 - 2026) - Mount Pleasant, SC - The State" key="og:title" property="og:title"/><meta data-react-helmet="true" content="View Anne Scott Teague Morris&#x27;s obituary, send flowers and sign the guestbook." key="og:description" property="og:description"/><meta data-react-helmet="true" content="https://cache.legacy.net/legacy/images/cobrands/thestate/photos/OB0000187886-1_20260831.jpgx?w=600&amp;h=499" key="og:image" property="og:image"/><meta data-react-helmet="true" content="https://cache.legacy.net/legacy/images/cobrands/thestate/photos/OB0000187886-1_20260831.jpgx?w=600&amp;h=499" key="og:image:secure_url" property="og:image:secure_url"/><meta data-react-helmet="true" content="499" key="og:image:height" property="og:image:height"/><meta data-react-helmet="true" content="600" key="og:image:width" property="og:image:width"/><script data-react-helmet="true" type="application/ld+json">{"@context":"http://schema.org","@type":"NewsArticle","articleBody":"Anne Scott Teague Morris passed away on August 27th, 2026. She was preceded in death by her husband, W.M. \"Moose\" Morris, and her parents, Arthur Ray and Dorothy Teague, as well as her brother, Foster Schuler Teague, and her sister, Elsa Teague Lampkin.  She is survived by her six children, Debbie Berry (Al), Ann Sewell (Howard), Barbara Tsklistas, Chuck Morris (Tess), Rob Domico (Rexanne) and Jeff Domico (Carrie). She is also survived by 13 grandchildren, Jordan, Jacob, Erin, Anna Kyle, Noah, Emily, Matt, Eli, Ben, Madison, Michael, Foster and Jackson along with 18 great grandchildren, niece Elizabeth Wharton and nephew Teague Lampkin, known to them all as \"Honey.\" She is beloved by many caring friends.  She was born on May 2, 1942 in Shreveport, Louisiana and grew up in Bossier City, La. After completing her education, she moved to San Diego, CA where she was employed in the legal department of NASA/General Dynamics. She then ventured to Washington, DC where she was administrative Aide to a Member of Congress. She was Education Administrator of the Richland County Historic Commission, managing the 4 historic houses and grounds in Columbia, SC, a volunteer for Meals on Wheels and volunteered at ECCO for 20 years. She was a member of the First United Methodist Church, Isle of Palms, where she served on many committees. She was a member of the MLBS Bible Study and awarded the Special Mission recognition by the United Methodist Women. She was a former member of the Alhambra Garden Club, the Isle of Palms Garden club and the Keatchie (La) Heritage Foundation. She loved to garden and loved nature.  She had unquestioning love for her husband and her children, grandchildren and great grandchildren as well as all their spouses. Her mantra was to be kind, do good, serve and take no credit for doing so. She had the gift of encouragement. Her sense of humor was unmistakable. Her late husband said to a friend, \"I love that woman, she makes me smile every day.\" Her oldest grandson said to her when a little boy, \"Honey you are a good woman,\" she hoped she was. She loved the Lord and was grateful he loved her and was with her every step of the way.  Memorials may be given to a charity of one's choice or to East Cooper Community Outreach (ECCO), or St. Jude's Children's Hospital.  A celebration of life will be held at the First United Methodist Church, Isle of Palms on Sunday, September 20, 2026 at 2pm. Interment will be a private service for the family. Arrangements are by J. Henry Stuhr, Inc. A memorial message may be sent to the family by visiting our website at www.jhenrystuhr.com","articleSection":"Obituaries","author":[{"@type":"Organization","name":"Legacy"}],"copyrightHolder":{"@type":"Organization","name":"Legacy.com","url":"https://www.legacy.com"},"creator":"Legacy.com","dateCreated":"2026-08-31T00:00:00.000Z","dateModified":"2026-08-31T00:00:00.000Z","datePublished":"2026-08-31T00:00:00.000Z","description":"Anne Scott Teague Morris passed away on August 27th, 2026. She was preceded in death by her husband, W.M. \"Moose\" Morris, and her parents, Arthur Ray and Dorothy Teague, as well as her brother, Foster","genre":"Obituary(Obit), Biography","headline":"Anne Morris Obituary (1942 - 2026) - Mount Pleasant, SC - The State","image":{"@type":"ImageObject","height":499,"url":"https://cache.legacy.net/legacy/images/cobrands/thestate/photos/OB0000187886-1_20260831.jpgx?w=419&h=499&option=3","width":419},"keywords":"Anne Scott Teague Morris, Obituaries","mainEntityOfPage":{"@type":"WebPage","@id":"https://www.legacy.com/us/obituaries/thestate/name/anne-morris-obituary?id=62316159"},"publisher":{"@type":"Organization","name":"Legacy","logo":{"@type":"ImageObject","height":60,"url":"https://cache.legacy.net/globalcontent/affiliatelogosgbmobile/legacy.pngx?w=244&h=60&option=1","width":244}},"publishingPrinciples":"https://www.legacy.com/memorial-writing/editorial-standards","url":"https://www.legacy.com/us/obituaries/thestate/name/anne-morris-obituary?id=62316159","comment":[{"@type":"Comment","author":{"@type":"Person","name":"The McGoldrick Family"},"dateCreated":"2026-09-18","text":"Moose and Family, sincere condolences from Atlanta. Thinking of you as you celebrate your beautiful mom's life on Sunday. xo"},{"@type":"Comment","author":{"@type":"Person","name":"M. Susan Jones"},"dateCreated":"2026-09-01","text":"Anne Scott was a fun, wonderful soul and I had the priviledge of being her doctor for a few years. I always looked forward to seeing Anne Scott and Moose as well. I think she would be proud to know I am volunteering at ECCO since my retirement....I thought of her the first time I walked through those doors. Anyway, I want to extend my condolences to her family...I know she is missed!"},{"@type":"Comment","author":{"@type":"Person","name":"Jon Hartke"},"dateCreated":"2026-08-31","text":"Rob, Rex, and Family - Thinking of you and your family as you celebrate Honey's life and the memories you shared.  My deepest condolences.  You are in my thoughts and prayers during this difficult time."},{"@type":"Comment","author":{"@type":"Person","name":"Rachel Farrell Gray (née Teague)"},"dateCreated":"2026-08-31","text":"I love you, Aunt Scott. You´ll be missed by so many. I will always hear your laugh and the way you always said my whole name anytime you´d speak to me. \"Get over here, Rachel Farrell Teague!\" \r\nI admired you so."}]}</script><script data-react-helmet="true" type="application/ld+json">{"@context":"http://schema.org","@type":"Person","additionalName":"Scott Teague","birthDate":"1942-5-2","deathDate":"2026-8-27","deathPlace":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"United States","addressLocality":"Mount Pleasant","addressRegion":"SC","postalCode":"29464"}},"familyName":"Morris","givenName":"Anne","image":"https://cache.legacy.net/legacy/images/cobrands/thestate/photos/OB0000187886-1_20260831.jpgx?w=419&h=499&option=3","name":"Anne Scott Teague Morris"}</script><script data-react-helmet="true" type="application/ld+json">{"@context":"http://schema.org","@type":"Event","description":"Funeral and Services for Anne Scott Teague Morris","endDate":"2026-09-20T15:00:00.000Z","image":"https://cache.legacy.net/legacy/images/cobrands/thestate/photos/OB0000187886-1_20260831.jpgx?w=419&h=499&option=3","location":{"@type":"Place","address":{"@type":"PostalAddress","addressCountry":"United States","addressLocality":"Isle of Palms","addressRegion":"SC","postalCode":"
